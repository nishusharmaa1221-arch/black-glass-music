name: Build Black Glass Music APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platforms;android-36" "build-tools;36.0.0"

      - name: Build FOSS debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: black-glass-music-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
